services:
  postgres:
    image: postgres:16-alpine
    container_name: bookstore_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-bookstore}
      TZ: Asia/Jakarta
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-bookstore}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookstore_network_dev

  migration:
    image: migrate/migrate:v4.18.2
    container_name: bookstore_migration_dev
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-bookstore}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookstore_network_dev

  redis:
    image: redis:7-alpine
    container_name: bookstore_redis_dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookstore_network_dev

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bookstore_rabbitmq_dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - bookstore_network_dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore_api_dev
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    volumes:
      - ./public:/app/public
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore_network_dev

volumes:
  postgres_data_dev:
    name: bookstore_postgres_data_dev
  redis_data_dev:
    name: bookstore_redis_data_dev
  rabbitmq_data_dev:
    name: bookstore_rabbitmq_data_dev

networks:
  bookstore_network_dev:
    name: bookstore_network_dev
    driver: bridge