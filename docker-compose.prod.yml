version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-bookstore}
      TZ: Asia/Jakarta
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mounts/azuredata/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-bookstore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore_network

  redis:
    image: redis:7-alpine
    restart: always
    entrypoint: >
      sh -c "if [ -n \"$REDIS_PASSWORD\" ]; then
        exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\";
      else
        exec redis-server --appendonly yes;
      fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /mounts/azuredata/redis:/data
    healthcheck:
      test: >
        sh -c "if [ -n \"$REDIS_PASSWORD\" ]; then
          redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG;
        else
          redis-cli ping | grep PONG;
        fi"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_MNESIA_BASE: /var/lib/rabbitmq/mnesia
    volumes:
      - /mounts/azuredata/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 25s
    networks:
      - bookstore_network

  app:
    image: bookstoreapiregistry.azurecr.io/bookstore-api:latest
    restart: always
    ports:
      - "8000:8000"
   
    env_file:
      - /mounts/azuredata/.env
    environment:
      - WEBSITES_PORT=8000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - STORAGE_LOCAL_BASE_DIR=/mounts/azuredata/public
    volumes:
      - /mounts/azuredata/public:/app/public
      - /mounts/azuredata/.env:/mounts/azuredata/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore_network

networks:
  bookstore_network:
    driver: bridge