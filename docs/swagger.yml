  # =========================================================================
  # SHIPPING
  # =========================================================================
  /api/v1/shipping/areas:
    get:
      tags:
        - Shipping
      summary: Search destination areas
      description: Public endpoint to search domestic destination areas by keyword using Biteship Maps API (minimum 3 characters).
      parameters:
        - in: query
          name: search
          required: true
          schema:
            type: string
            minLength: 3
          description: "Search keyword for administrative area (minimum 3 characters, e.g. kemang, kebayoran)"
          example: "kemang"
      responses:
        '200':
          description: Areas retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "areas retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AreaItem'
        '400':
          description: Search parameter must be at least 3 characters
        '500':
          description: Failed to retrieve areas from Biteship

  /api/v1/shipping/couriers:
    get:
      tags:
        - Shipping
      summary: Get available couriers
      description: Public endpoint to retrieve all supported courier partners and services provided by Biteship.
      responses:
        '200':
          description: Couriers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "couriers retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourierDetail'
        '400':
          description: Failed to retrieve couriers

  /api/v1/shipping/rates:
    post:
      tags:
        - Shipping
      summary: Calculate dynamic shipping rates
      description: Authenticated endpoint to calculate real-time courier shipping rates and estimated delivery times for selected cart items to a destination address.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetShippingRatesRequest'
      responses:
        '200':
          description: Shipping rates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "shipping rates retrieved successfully"
                  data:
                    $ref: '#/components/schemas/ShippingRatesResponse'
        '400':
          description: Cart is empty or invalid payload
        '401':
          description: Unauthorized request
        '404':
          description: Address, cart item, or book not found
        '502':
          description: Failed to retrieve shipping rates from courier provider

  /api/v1/shipping/webhook:
    post:
      tags:
        - Shipping
      summary: Handle Biteship tracking webhook
      description: Webhook endpoint called by Biteship to push real-time delivery status updates. Authenticated via X-Biteship-Signature header.
      security:
        - BiteshipSignatureAuth: []
      parameters:
        - in: header
          name: X-Biteship-Signature
          required: true
          schema:
            type: string
          description: Webhook secret signature configured for Biteship verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiteshipWebhookPayload'
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid webhook payload
        '401':
          description: Missing or invalid signature
        '500':
          description: Failed to handle webhook update

  /api/v1/orders/{invoice_number}/tracking:
    get:
      tags:
        - Shipping
        - Order
      summary: Track order shipment
      description: Authenticated endpoint for customers and admins to retrieve real-time courier tracking milestones and status for an order.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: invoice_number
          required: true
          schema:
            type: string
          description: Order invoice number
          example: "INV-20261017-0001"
      responses:
        '200':
          description: Tracking details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "tracking details retrieved successfully"
                  data:
                    $ref: '#/components/schemas/TrackingDetailResult'
        '400':
          description: Tracking number has not been issued yet
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (user does not own this order)
        '404':
          description: Order or shipment details not found

  /api/v1/orders/{invoice_number}/fulfill:
    post:
      tags:
        - Shipping
      summary: Dispatch courier pickup (Admin)
      description: Admin-only endpoint to trigger automated pickup dispatch via Biteship for a paid order. Generates shipment records and waybill numbers.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: invoice_number
          required: true
          schema:
            type: string
          description: Order invoice number
          example: "INV-20261017-0001"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillOrderRequest'
      responses:
        '200':
          description: Pickup scheduled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "pickup scheduled successfully"
                  data:
                    $ref: '#/components/schemas/FulfillOrderResponse'
        '400':
          description: Order is not paid yet or shipment is already fulfilled
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Order not found
        '502':
          description: Failed to dispatch pickup request to courier provider

  /api/v1/orders/{invoice_number}/return:
    post:
      tags:
        - Shipping
      summary: Process order return (Admin)
      description: Admin-only endpoint to mark an order as returned and automatically restore item stock levels.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: invoice_number
          required: true
          schema:
            type: string
          description: Order invoice number
          example: "INV-20261017-0001"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessReturnRequest'
      responses:
        '200':
          description: Order return processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid return state (order must be shipped or completed) or order already returned
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Order not found

  # =========================================================================
  # CHECKOUT
  # =========================================================================
  /api/v1/checkout/preview:
    post:
      tags:
        - Checkout
      summary: Preview checkout calculation
      description: Authenticated endpoint to simulate order checkout with real-time book prices, shipping rates, voucher discounts, and payment admin fees prior to placing an order.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutPreviewRequest'
      responses:
        '200':
          description: Checkout preview calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "checkout preview calculated successfully"
                  data:
                    $ref: '#/components/schemas/CheckoutPreviewResponse'
        '400':
          description: Cart is empty, insufficient stock, or discount invalid
        '401':
          description: Unauthorized request
        '404':
          description: Destination address not found

  /api/v1/checkout/order:
    post:
      tags:
        - Checkout
      summary: Create order and initiate payment
      description: Authenticated endpoint to convert selected cart items into a confirmed order, deduct stock, calculate shipping and discounts, and charge via Midtrans.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "order created successfully"
                  data:
                    $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Cart empty, insufficient stock, discount invalid/expired, or unsupported payment method
        '401':
          description: Unauthorized request
        '404':
          description: Destination address or cart items not found
        '502':
          description: Midtrans charge request failed

  /api/v1/payments/midtrans/webhook:
    post:
      tags:
        - Checkout
      summary: Handle Midtrans payment notification
      description: Asynchronous payment notification webhook called by Midtrans. Verifies SHA512 signature and updates order status upon settlement, expiration, or cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransWebhookPayload'
      responses:
        '200':
          description: Payment notification handled successfully
          content:
            application/json:
              example:
                status: "ok"
                message: "notification handled successfully"
        '400':
          description: Cannot parse notification body
          content:
            application/json:
              example:
                status: "error"
                message: "cannot parse notification body"
        '403':
          description: Invalid Midtrans webhook signature
          content:
            application/json:
              example:
                status: "error"
                message: "invalid midtrans webhook signature"
        '500':
          description: Failed to process payment update

  # =========================================================================
  # ORDER
  # =========================================================================
  /api/v1/orders:
    get:
      tags:
        - Order
      summary: Get user orders
      description: Authenticated endpoint to retrieve order history for the authenticated user, optionally filtered by order status.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [waiting_payment, paid, processing, shipped, completed, cancelled, returned]
          description: "Filter orders by status (optional)."
          example: "paid"
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "orders retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderListItemResponse'
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error

  /api/v1/orders/{invoice_number}:
    get:
      tags:
        - Order
      summary: Get order detail
      description: Authenticated endpoint to retrieve full details for a specific order by its unique invoice number.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: invoice_number
          required: true
          schema:
            type: string
          description: Order invoice number
          example: "INV-20261017-0001"
      responses:
        '200':
          description: Order detail retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "order detail retrieved successfully"
                  data:
                    $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          description: Invoice number parameter is required
        '401':
          description: Unauthorized request
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /api/v1/orders/all:
    get:
      tags:
        - Order
      summary: List all orders with pagination (Admin only)
      description: Retrieves a paginated list of all customer orders for administration. Supports filtering by status, search keyword (matching invoice number, recipient name, or customer name/email), date range, and sorting.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
          description: Number of records per page
        - in: query
          name: search
          schema:
            type: string
          description: Search keyword matching invoice number, recipient name, or customer name/email
        - in: query
          name: status
          schema:
            type: string
            enum: [waiting_payment, paid, processing, shipped, completed, cancelled, returned]
          description: Filter orders by status
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Filter orders placed on or after this date (YYYY-MM-DD)
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Filter orders placed on or before this date (YYYY-MM-DD)
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [created_at, total_amount, status]
            default: created_at
          description: Column to sort by
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: Orders list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "orders retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminOrderListItemResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '500':
          description: Internal server error

  /api/v1/orders/detail/{invoice_number}:
    get:
      tags:
        - Order
      summary: Get complete order detail with customer account profile (Admin only)
      description: Authenticated endpoint for administrators to view exhaustive order details, including the purchasing customer's registered profile, recipient shipping details, real-time courier tracking status, itemized items, and complete payment breakdown.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: invoice_number
          required: true
          schema:
            type: string
          description: Order invoice number
          example: "INV-20261017-0001"
      responses:
        '200':
          description: Order detail retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "order detail retrieved successfully"
                  data:
                    $ref: '#/components/schemas/AdminOrderDetailResponse'
        '400':
          description: Invoice number parameter is required
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /api/v1/orders/{invoice_number}/pdf:
    get:
      tags:
        - Order
      summary: Download order invoice receipt in PDF
      description: Authenticated endpoint to download the official invoice receipt in PDF format. Regular customers can only access their own invoices; admins can download invoices for any order.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: invoice_number
          required: true
          schema:
            type: string
          description: Unique invoice number
          example: "INV-20261017-0001"
      responses:
        '200':
          description: Order invoice receipt PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Access denied to this order invoice)
        '404':
          description: Order not found
        '500':
          description: Internal server error

  # =========================================================================
  # REPORT
  # =========================================================================
  /api/v1/reports:
    get:
      tags:
        - Report
      summary: Get sales and order analytics report (Admin only)
      description: Generates an executive sales analytics report aggregating gross revenue, net revenue, discounts, average order value, top-selling books, daily sales trends, and order details for a given date range.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Report period start date (YYYY-MM-DD). Defaults to 30 days ago.
          example: "2026-09-01"
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Report period end date (YYYY-MM-DD). Defaults to today.
          example: "2026-10-21"
        - in: query
          name: status
          schema:
            type: string
            enum: [all, waiting_payment, paid, processing, shipped, completed, cancelled, returned]
            default: all
          description: Filter orders included in the report by status
      responses:
        '200':
          description: Order report generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "order report generated successfully"
                  data:
                    $ref: '#/components/schemas/OrderReportResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '500':
          description: Internal server error

  /api/v1/reports/pdf:
    get:
      tags:
        - Report
      summary: Download executive sales report PDF (Admin only)
      description: Generates and streams an executive-grade sales report in PDF format featuring high-contrast metric cards with hard offset shadows, zero-radius geometric styling, top-selling books leaderboard, and detailed order listings.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Report period start date (YYYY-MM-DD). Defaults to 30 days ago.
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Report period end date (YYYY-MM-DD). Defaults to today.
        - in: query
          name: status
          schema:
            type: string
            enum: [all, waiting_payment, paid, processing, shipped, completed, cancelled, returned]
            default: all
          description: Filter orders included in the report by status
      responses:
        '200':
          description: Executive sales report PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '500':
          description: Internal server error

  # =========================================================================
  # UPLOADS
  # =========================================================================
  /api/v1/uploads:
    post:
      tags:
        - Upload
      summary: Upload an image asset
      description: |
        Uploads an image file (JPEG, PNG, WebP) to the configured object storage (local disk or AWS S3).
        Returns the stored file URL and key to be used when creating or updating categories or books.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: "Image file to upload (JPEG, PNG, WebP, max 2MB)."
                folder:
                  type: string
                  default: uploads
                  description: "Optional folder. Defaults to 'uploads' for temporary files, which are later committed to 'covers' or 'categories' upon entity creation/update."
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "file uploaded successfully"
                  data:
                    $ref: '#/components/schemas/UploadFileResponse'
        '400':
          description: Bad request (invalid MIME type, empty file, or size exceeds 2MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '500':
          description: Internal server error
    delete:
      tags:
        - Upload
      summary: Delete an uploaded file
      description: |
        Deletes a previously uploaded file from storage by its URL or key.
        Useful when a user replaces an image or abandons a form before submission.

        The target file is specified via query parameters: `?file_url=...` or `?file_key=...`.
      security:
        - BearerAuth: []
      parameters:
        - name: file_url
          in: query
          required: false
          schema:
            type: string
          description: Public URL of the file to delete
        - name: file_key
          in: query
          required: false
          schema:
            type: string
          description: Storage key of the file to delete
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Missing file_url or file_key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: File not found in storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error

  # =========================================================================
  # STATIC ASSETS
  # =========================================================================
  /api/v1/static/{filepath}:
    get:
      tags:
        - Health
      summary: Access static uploaded files
      description: Public endpoint to serve static assets such as uploaded book cover images from local storage.
      parameters:
        - in: path
          name: filepath
          required: true
          schema:
            type: string
          description: "Relative file path under public storage (e.g. covers/my-book.jpg)"
          example: "covers/pragmatic-programmer.jpg"
      responses:
        '200':
          description: Static file content stream (image/jpeg, image/png, etc.)
        '404':
          description: File not found

