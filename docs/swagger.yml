  /api/v1/discounts/check:
    post:
      tags:
        - Discount
      summary: Validate voucher & calculate cart discount
      description: Authenticated user checkout verification. Fetches book prices and active status directly from the database (no client-side price injection).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckDiscountRequest'
      responses:
        '200':
          description: Voucher applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "voucher applied successfully"
                  data:
                    $ref: '#/components/schemas/CheckDiscountResult'
        '400':
          description: Voucher expired, quota exhausted, minimum purchase not met, or not applicable to cart items
        '401':
          description: Unauthorized request
        '404':
          description: Voucher code not found or cart book not found in database
        '500':
          description: Internal server error

  # =========================================================================
  # CART
  # =========================================================================
  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Get user shopping cart
      description: Retrieves the current active shopping cart for the authenticated user, including subtotal, total weight (in grams for shipping calculation), and real-time book stock.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "cart retrieved successfully"
                  data:
                    $ref: '#/components/schemas/CartResult'
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error
    delete:
      tags:
        - Cart
      summary: Clear shopping cart
      description: Hard deletes all items currently in the authenticated user's shopping cart.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart cleared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error

  /api/v1/cart/items:
    post:
      tags:
        - Cart
      summary: Add book to cart
      description: Adds a book to the authenticated user's cart. If the book already exists in the cart, the quantity is accumulated automatically. Validates real-time book stock and active status.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '201':
          description: Item added to cart successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error, inactive book, or insufficient stock
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error

  /api/v1/cart/items/{id}:
    patch:
      tags:
        - Cart
      summary: Update cart item quantity
      description: Updates the quantity of a specific item in the authenticated user's cart. Verifies ownership and book stock.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Cart Item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error, invalid ID parameter, inactive book, or insufficient stock
        '401':
          description: Unauthorized request
        '404':
          description: Cart item not found or does not belong to user
        '500':
          description: Internal server error
    delete:
      tags:
        - Cart
      summary: Delete single cart item
      description: Hard deletes a specific item from the authenticated user's cart.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Cart Item ID
      responses:
        '200':
          description: Cart item deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Cart item not found or does not belong to user
        '500':
          description: Internal server error

  /api/v1/cart/selected:
    post:
      tags:
        - Cart
      summary: Calculate and preview selected cart items (Selective Checkout)
      description: Calculates subtotal price, total quantity, and shipping weight for a selected subset of items (Shopee style checkout preview). Verifies that all selected items exist in the user's cart, books are active, and stock is sufficient.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectedCartItemsRequest'
      responses:
        '200':
          description: Selected items calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "selected items calculated successfully"
                  data:
                    $ref: '#/components/schemas/SelectedCartItemsResult'
        '400':
          description: Validation error, empty list, book inactive, or requested quantity exceeds available stock
        '401':
          description: Unauthorized request
        '404':
          description: One or more selected cart items not found in user's cart
        '500':
          description: Internal server error

