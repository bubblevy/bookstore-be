    # =========================================================================
    # DISCOUNT SCHEMAS
    # =========================================================================
    DiscountTierRequest:
      type: object
      required:
        - min_spend
        - reward_type
        - reward_value
      properties:
        min_spend:
          type: integer
          minimum: 0
          description: "Minimum cart subtotal required to qualify for this tier"
          example: 100000
        reward_type:
          type: string
          enum: [PERCENTAGE, FIXED]
          description: "Type of reward applied at this tier"
          example: "FIXED"
        reward_value:
          type: integer
          minimum: 1
          description: "Reward value (fixed amount in currency, or percentage rate)"
          example: 5000
        max_reward:
          type: integer
          nullable: true
          minimum: 1
          description: "Maximum reward cap amount for PERCENTAGE reward type (optional)."
          example: null

    CreateDiscountRequest:
      type: object
      required:
        - code
        - name
        - discount_type
        - discount_value
        - is_all_books
        - start_date
        - end_date
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9]+$'
          description: "Unique voucher coupon code (automatically normalized to uppercase)"
          example: "BOOKFEST10"
        name:
          type: string
          minLength: 3
          maxLength: 150
          description: "Display name of the discount promotion"
          example: "Book Festival Up To 10% Off"
        description:
          type: string
          nullable: true
          description: "Description or terms of the promotion (optional)."
          example: "Tiered discount promotion for selected programming and fiction books."
        discount_type:
          type: string
          enum: [PERCENTAGE, FIXED, TIERED]
          description: "Discount calculation strategy"
          example: "TIERED"
        discount_value:
          type: integer
          minimum: 1
          description: "Base discount value for PERCENTAGE/FIXED, or max headline rate for TIERED"
          example: 10
        min_purchase:
          type: integer
          minimum: 0
          default: 0
          description: "Minimum cart subtotal spend requirement (optional, defaults to 0)."
          example: 100000
        max_discount_amount:
          type: integer
          nullable: true
          minimum: 1
          description: "Global maximum discount cap amount (optional)."
          example: 25000
        quota:
          type: integer
          minimum: 0
          default: 0
          description: "Maximum total redemptions allowed (optional, 0 indicates unlimited)."
          example: 100
        is_all_books:
          type: boolean
          description: "Whether discount applies to all books. If false, book_ids must be provided."
          example: false
        is_active:
          type: boolean
          default: true
          description: "Whether the voucher is currently active (optional, defaults to true)."
          example: true
        start_date:
          type: string
          format: date-time
          description: "Start validity timestamp"
          example: "2026-10-01T00:00:00Z"
        end_date:
          type: string
          format: date-time
          description: "End expiration timestamp"
          example: "2026-10-31T23:59:59Z"
        book_ids:
          type: array
          items:
            type: integer
          description: "Eligible book IDs when is_all_books is false (optional)."
          example: [1, 2]
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/DiscountTierRequest'
          description: "Threshold reward tiers required when discount_type is TIERED (optional)."

