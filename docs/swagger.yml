          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
        - confirm_password
      properties:
        current_password:
          type: string
          format: password
          example: "OldP@ssw0rd!"
        new_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"

