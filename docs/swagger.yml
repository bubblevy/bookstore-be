          minLength: 3
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          description: "Must be at least 8 characters, with uppercase, lowercase, number, and special character."
          example: "StrongP@ssw0rd!"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "StrongP@ssw0rd!"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: "Required only if not provided via HTTP-only cookie"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ActivateAccountRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: "random_hex_token_from_email"

    ResendActivationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
        - confirm_password
      properties:
        token:
          type: string
          example: "random_hex_token_from_email"
        new_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
        - confirm_password
      properties:
        current_password:
          type: string
          format: password
          example: "OldP@ssw0rd!"
        new_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
