openapi: 3.0.3
info:
  title: Bookstore API
  description: The core API for the Bookstore application. This comprehensive API serves as the backend for the entire platform, handling authentication, user management, product catalogs, transactions, and other essential services.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
tags:
  - name: Health
    description: System health and readiness checks
  - name: Auth
    description: User authentication and account management
  - name: Category
    description: Book category catalog management (Public browsing, Admin CRUD)
  - name: Publisher
    description: Book publisher catalog management (Public browsing, Admin CRUD)
  - name: Author
    description: Book author catalog management (Public browsing, Admin CRUD, paginated books)
  - name: Address
    description: User shipping address management (CRUD, primary address, max 5 addresses)
  - name: Shipping
    description: RajaOngkir destination lookup and authenticated shipping cost calculation
paths:
  /health:
    get:
      tags:
        - Health
      summary: System health check
      description: Returns the basic operational status of the service.
      responses:
        '200':
          description: Service is up and running
          content:
            application/json:
              example:
                status: ok
                service: Bookstore
                timestamp: "2026-10-02T00:00:00Z"

  /health/ready:
    get:
      tags:
        - Health
      summary: Database readiness check
      description: Verifies if the service is successfully connected to the database.
      responses:
        '200':
          description: Database is connected
          content:
            application/json:
              example:
                status: ok
                database: connected
                timestamp: "2026-10-02T00:00:00Z"
        '503':
          description: Database connection unavailable

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account and sends an activation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload or email already exists

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticates a user and sets HTTP-only cookies for access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=abcde12345; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid credentials or inactive account

  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Generates a new access and refresh token pair. Accepts refresh token via HTTP-only cookie or request body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid, missing, or expired refresh token

  /api/v1/auth/logout:
    delete:
      tags:
        - Auth
      summary: User logout
      description: Revokes the current refresh token and clears authentication cookies.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/activate-account:
    post:
      tags:
        - Auth
      summary: Activate user account
      description: Activates a newly registered account using the token sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Account activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired activation token

  /api/v1/auth/resend-activation:
    post:
      tags:
        - Auth
      summary: Resend activation email
      description: Generates a new activation token and resends the activation email to an unactivated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendActivationRequest'
      responses:
        '200':
          description: Activation email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Sends a password reset link to the user's registered email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset password email sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: Resets the user's password using the token sent via email. Also revokes all existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid token, expired token, or password mismatch

  /api/v1/auth/change-password:
    post:
      tags:
        - Auth
      summary: Change account password
      description: Allows an authenticated user to change their password. Revokes other active sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Incorrect current password or password mismatch
        '401':
          description: Unauthorized request

  /api/v1/auth/google/login:
    get:
      tags:
        - Auth
      summary: Initiate Google OAuth2 Login
      description: Redirects the user to the Google Consent screen.
      responses:
        '303':
          description: Redirects to Google's OAuth2 authorization URL.

  /api/v1/auth/google/callback:
    get:
      tags:
        - Auth
      summary: Google OAuth2 Callback
      description: The callback endpoint for Google OAuth2. Exchanges authorization code for token, creates or links user, sets HTTP-only cookies, and redirects to frontend dashboard.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: The authorization code returned by Google.
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: The CSRF state token to validate against the cookie.
      responses:
        '303':
          description: Login successful, sets `access_token` and `refresh_token` cookies, and redirects to dashboard.
        '400':
          description: Missing code or invalid request.
        '401':
          description: Invalid OAuth state (CSRF failure).

  /api/v1/categories:
    get:
      tags:
        - Category
      summary: Get all active categories
      description: Public endpoint to retrieve all categories available in the store (unpaginated).
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "categories retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryListItem'
        '500':
          description: Internal server error
    post:
      tags:
        - Category
      summary: Create a category
      description: Admin-only endpoint to create a new book category. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category created successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Category slug already exists
        '500':
          description: Internal server error

  /api/v1/categories/{slug}:
    get:
      tags:
        - Category
      summary: Get category by slug
      description: Public endpoint to retrieve details of a specific category using its slug.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The category slug (e.g. fiksi-ilmiah)
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category retrieved successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '404':
          description: Category not found
        '500':
          description: Internal server error

  /api/v1/categories/{id}:
    put:
      tags:
        - Category
      summary: Update a category
      description: Admin-only endpoint to update an existing category's name and regenerated slug.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category updated successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Category not found
        '409':
          description: Category slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Category
      summary: Delete a category
      description: Admin-only endpoint to soft-delete a category.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The category ID
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Category not found
        '500':
          description: Internal server error

  /api/v1/publishers:
    get:
      tags:
        - Publisher
      summary: Get all active publishers
      description: Public endpoint to retrieve all publishers available in the store (unpaginated).
      responses:
        '200':
          description: Publishers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publishers retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublisherListItem'
        '500':
          description: Internal server error
    post:
      tags:
        - Publisher
      summary: Create a publisher
      description: Admin-only endpoint to create a new book publisher. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublisherRequest'
      responses:
        '201':
          description: Publisher created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher created successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Publisher slug already exists
        '500':
          description: Internal server error

  /api/v1/publishers/{slug}:
    get:
      tags:
        - Publisher
      summary: Get publisher by slug
      description: Public endpoint to retrieve details of a specific publisher using its slug.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The publisher slug (e.g. gramedia-pustaka-utama)
      responses:
        '200':
          description: Publisher retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher retrieved successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '404':
          description: Publisher not found
        '500':
          description: Internal server error

  /api/v1/publishers/{id}:
    put:
      tags:
        - Publisher
      summary: Update a publisher
      description: Admin-only endpoint to update an existing publisher's name and regenerated slug.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The publisher ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublisherRequest'
      responses:
        '200':
          description: Publisher updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher updated successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Publisher not found
        '409':
          description: Publisher slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Publisher
      summary: Delete a publisher
      description: Admin-only endpoint to soft-delete a publisher.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The publisher ID
      responses:
        '200':
          description: Publisher deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Publisher not found
        '500':
          description: Internal server error

  /api/v1/authors:
    get:
      tags:
        - Author
      summary: Get all active authors (paginated)
      description: Public endpoint to retrieve active authors with pagination metadata.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Authors retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "authors retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          description: Internal server error
    post:
      tags:
        - Author
      summary: Create an author
      description: Admin-only endpoint to create a new author. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
      responses:
        '201':
          description: Author created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author created successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Author slug already exists
        '500':
          description: Internal server error

  /api/v1/authors/{slug}:
    get:
      tags:
        - Author
      summary: Get author by slug with paginated books
      description: Public endpoint to retrieve author details and a paginated list of their active books.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Author slug (e.g. tere-liye)
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Book list page number
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Books per page
      responses:
        '200':
          description: Author retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author retrieved successfully"
                  data:
                    $ref: '#/components/schemas/AuthorDetailResult'
        '404':
          description: Author not found
        '500':
          description: Internal server error

  /api/v1/authors/{id}:
    put:
      tags:
        - Author
      summary: Update an author
      description: Admin-only endpoint to update an existing author's name and biography.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Author ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorRequest'
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author updated successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Author not found
        '409':
          description: Author slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Author
      summary: Delete an author
      description: Admin-only endpoint to soft-delete an author.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Author ID
      responses:
        '200':
          description: Author deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Author not found
        '500':
          description: Internal server error

  /api/v1/addresses:
    get:
      tags:
        - Address
      summary: Get all user addresses
      description: Returns a simplified list of addresses belonging to the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Addresses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "addresses retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressListItem'
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error
    post:
      tags:
        - Address
      summary: Create a new address
      description: Adds a new address for the authenticated user using RajaOngkir/Komerce destination ID. Maximum 5 addresses per user. First address becomes primary automatically.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address created successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Validation error or maximum address limit reached (5 addresses)
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error

  /api/v1/addresses/{id}:
    get:
      tags:
        - Address
      summary: Get address details by ID
      description: Returns complete details of a specific address owned by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Address retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address retrieved successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error
    put:
      tags:
        - Address
      summary: Update an address
      description: Updates an existing address owned by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address updated successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error
    delete:
      tags:
        - Address
      summary: Delete an address
      description: Performs a soft-delete on an address. Blocked if the address is primary and other addresses exist.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Address deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Cannot delete primary address while other addresses exist, or invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error

  /api/v1/addresses/{id}/primary:
    patch:
      tags:
        - Address
      summary: Set address as primary
      description: Sets the selected address as the primary address and unsets any previous primary address.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Primary address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error

  /api/v1/shipping/destinations:
    get:
      tags:
        - Shipping
      summary: Search domestic destination
      description: Public single-endpoint location lookup using keyword (minimum 3 characters) powered by RajaOngkir/Komerce.
      parameters:
        - in: query
          name: search
          required: true
          schema:
            type: string
            minLength: 3
          description: Keyword to search (e.g., welahan, gayamprit, klaten)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
          description: Limit number of results
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: Destinations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "destinations retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomesticDestination'
        '400':
          description: Search keyword must be at least 3 characters
        '500':
          description: Failed to retrieve destinations from RajaOngkir

  /api/v1/shipping/cost:
    post:
      tags:
        - Shipping
      summary: Calculate domestic shipping cost
      description: Calculates delivery rates from store origin (Welahan, Jepara) to the destination location ID using selected couriers. Requires authentication as purchase checkout mandates login.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckCostRequest'
      responses:
        '200':
          description: Shipping costs calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "shipping costs calculated successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShippingCostResult'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized request
        '500':
          description: Failed to calculate shipping costs from RajaOngkir

