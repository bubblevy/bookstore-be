    # =========================================================================
    # DISCOUNT SCHEMAS
    # =========================================================================
    DiscountTierRequest:
      type: object
      required:
        - min_spend
        - reward_type
        - reward_value
      properties:
        min_spend:
          type: number
          format: double
          minimum: 0
          example: 100000.00
        reward_type:
          type: string
          enum: [PERCENTAGE, FIXED]
          example: "FIXED"
        reward_value:
          type: number
          format: double
          minimum: 0.01
          example: 5000.00
        max_reward:
          type: number
          format: double
          nullable: true
          minimum: 0.01
          example: null

    CreateDiscountRequest:
      type: object
      required:
        - code
        - name
        - discount_type
        - discount_value
        - min_purchase
        - is_all_books
        - start_date
        - end_date
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9]+$'
          description: Unique voucher code (automatically converted to uppercase)
          example: "DISKONHEMAT10"
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: "Promo Belanja Hemat Up To 10%"
        description:
          type: string
          nullable: true
          example: "Potongan harga bertingkat untuk buku pilihan"
        discount_type:
          type: string
          enum: [PERCENTAGE, FIXED, TIERED]
          example: "TIERED"
        discount_value:
          type: number
          format: double
          minimum: 0.01
          description: Base value for PERCENTAGE/FIXED, or max rate cap representation for TIERED
          example: 10.00
        min_purchase:
          type: number
          format: double
          minimum: 0
          default: 0
          example: 100000.00
        max_discount_amount:
          type: number
          format: double
          nullable: true
          minimum: 0.01
          description: Global max discount cap
          example: 25000.00
        quota:
          type: integer
          minimum: 0
          default: 0
          description: Max total redemptions (0 indicates unlimited)
          example: 100
        is_all_books:
          type: boolean
          description: If true, discount applies to all books. If false, book_ids must be specified.
          example: false
        is_active:
          type: boolean
          default: true
          example: true
        start_date:
          type: string
          format: date-time
          example: "2026-10-01T00:00:00Z"
        end_date:
          type: string
          format: date-time
          example: "2026-10-31T23:59:59Z"
        book_ids:
          type: array
          items:
            type: integer
          description: Eligible book IDs (used when is_all_books is false)
          example: [1, 2]
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/DiscountTierRequest'
          description: Threshold reward tiers (required if discount_type is TIERED)

