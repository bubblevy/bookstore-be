openapi: 3.0.3
info:
  title: Bookstore API
  description: The core API for the Bookstore application. This comprehensive API serves as the backend for the entire platform, handling authentication, user management, product catalogs, transactions, and other essential services.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
tags:
  - name: Health
    description: System health and readiness checks
  - name: Auth
    description: User authentication and account management
  - name: User
    description: User profile and admin user management
  - name: Category
    description: Book category catalog management
  - name: Publisher
    description: Book publisher catalog management
  - name: Author
    description: Book author catalog management
  - name: Book
    description: Book catalog management
  - name: Discount
    description: Discount & voucher management
  - name: Cart
    description: User shopping cart management
  - name: Wishlist
    description: User book wishlist and favorite items management
  - name: Address
    description: User shipping address management
  - name: Shipping
    description: Biteship destination area lookup, couriers, authenticated rate calculation, shipment tracking, order fulfillment, return management, and tracking webhooks
  - name: Checkout
    description: Pre-checkout quotation, order placement, and Midtrans payment webhooks
  - name: Order
    description: User order history, invoice retrieval, and detailed order status
  - name: Report
    description: Executive sales and order performance analytics, KPI summaries, and PDF export
  - name: Upload
    description: Image and asset upload management for book covers and categories


paths:
  # =========================================================================
  # HEALTH
  # =========================================================================
  /health:
    get:
      tags:
        - Health
      summary: System health check
      description: Returns the basic operational status of the service.
      responses:
        '200':
          description: Service is up and running
          content:
            application/json:
              example:
                status: ok
                service: Bookstore
                timestamp: "2026-10-02T00:00:00Z"

  /health/ready:
    get:
      tags:
        - Health
      summary: Database readiness check
      description: Verifies if the service is successfully connected to the database.
      responses:
        '200':
          description: Database is connected
          content:
            application/json:
              example:
                status: ok
                database: connected
                timestamp: "2026-10-02T00:00:00Z"
        '503':
          description: Database connection unavailable

  # =========================================================================
  # AUTH
  # =========================================================================
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account and sends an activation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload or email already exists

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticates a user, returns access & refresh tokens in the JSON response payload, and sets HTTP-only cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=abcde12345; Path=/; HttpOnly
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "login successful"
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials or inactive account

  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Generates a new access and refresh token pair. Accepts refresh token via HTTP-only cookie or request body (recommended for mobile clients). Returns tokens in response payload and updates cookies.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=abcde12345; Path=/; HttpOnly
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "token refreshed successfully"
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid, missing, or expired refresh token

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      description: Revokes the current refresh token and clears authentication cookies. Accepts refresh token via JSON request body (recommended for mobile clients) or HTTP-only cookie.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      tags:
        - Auth
      summary: User logout (via cookie)
      description: Revokes the current refresh token and clears authentication cookies via HTTP-only cookie.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/activate-account:
    post:
      tags:
        - Auth
      summary: Activate user account
      description: Activates a newly registered account using the token sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Account activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired activation token

  /api/v1/auth/resend-activation:
    post:
      tags:
        - Auth
      summary: Resend activation email
      description: Generates a new activation token and resends the activation email to an unactivated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendActivationRequest'
      responses:
        '200':
          description: Activation email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Sends a password reset link to the user's registered email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset password email sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: Resets the user's password using the token sent via email. Also revokes all existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid token, expired token, or password mismatch

  /api/v1/auth/change-password:
    post:
      tags:
        - Auth
      summary: Change account password
      description: Allows an authenticated user to change their password. Revokes other active sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Incorrect current password or password mismatch
        '401':
          description: Unauthorized request

  /api/v1/auth/google/login:
    get:
      tags:
        - Auth
      summary: Initiate Google OAuth2 Login
      description: Redirects the user to the Google Consent screen.
      responses:
        '303':
          description: Redirects to Google's OAuth2 authorization URL.

  /api/v1/auth/google/callback:
    get:
      tags:
        - Auth
      summary: Google OAuth2 Callback
      description: The callback endpoint for Google OAuth2.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '303':
          description: Login successful, sets auth cookies, and redirects.
        '400':
          description: Missing code or invalid request.
        '401':
          description: Invalid OAuth state (CSRF failure).

  /api/v1/auth/google/mobile:
    post:
      tags:
        - Auth
      summary: Google Login for Mobile Apps
      description: |
        Authenticates a user from mobile apps (Flutter, React Native, iOS, Android).
        Accepts a Google `id_token` obtained from native mobile Google Sign-In SDK (recommended) or server authorization `code`.
        Returns `access_token` and `refresh_token` in the JSON response payload and sets auth cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleMobileLoginRequest'
      responses:
        '200':
          description: Google login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=abcde12345; Path=/; HttpOnly
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "google login successful"
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request payload or missing id_token/code
        '401':
          description: Invalid or expired Google token

  # =========================================================================
  # USER & PROFILE MANAGEMENT
  # =========================================================================
  /api/v1/users/me:
    get:
      tags:
        - User
      summary: Get current authenticated user profile
      description: Returns safe, non-sensitive profile information for the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: user profile retrieved successfully
                  data:
                    $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized access or expired token
        '404':
          description: User profile not found

  /api/v1/users:
    get:
      tags:
        - User
      summary: List users with pagination (Admin only)
      description: Retrieves a paginated list of users for administration. Supports filtering by name, email, role, and active status.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
          description: Search term matching user name or email
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, admin]
        - in: query
          name: is_active
          schema:
            type: boolean
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: users retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfileResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)

  # =========================================================================
  # CATEGORIES
  # =========================================================================
  /api/v1/categories:
    get:
      tags:
        - Category
      summary: Get all active categories
      description: Public endpoint to retrieve all categories available in the store (unpaginated).
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "categories retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryListItem'
        '500':
          description: Internal server error
    post:
      tags:
        - Category
      summary: Create a category
      description: Admin-only endpoint to create a new book category. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category created successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Category slug already exists
        '500':
          description: Internal server error

  /api/v1/categories/{slug}:
    get:
      tags:
        - Category
      summary: Get category by slug
      description: Public endpoint to retrieve details of a specific category using its slug.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The category slug (e.g. fiksi-ilmiah)
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category retrieved successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '404':
          description: Category not found
        '500':
          description: Internal server error

  /api/v1/categories/{id}:
    put:
      tags:
        - Category
      summary: Update a category
      description: Admin-only endpoint to update an existing category's name and regenerated slug.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category updated successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Category not found
        '409':
          description: Category slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Category
      summary: Delete a category
      description: Admin-only endpoint to soft-delete a category.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The category ID
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Category not found
        '500':
          description: Internal server error

  # =========================================================================
  # PUBLISHERS
  # =========================================================================
  /api/v1/publishers:
    get:
      tags:
        - Publisher
      summary: Get all active publishers
      description: Public endpoint to retrieve all publishers available in the store (unpaginated).
      responses:
        '200':
          description: Publishers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publishers retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublisherListItem'
        '500':
          description: Internal server error
    post:
      tags:
        - Publisher
      summary: Create a publisher
      description: Admin-only endpoint to create a new book publisher. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublisherRequest'
      responses:
        '201':
          description: Publisher created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher created successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Publisher slug already exists
        '500':
          description: Internal server error

  /api/v1/publishers/{slug}:
    get:
      tags:
        - Publisher
      summary: Get publisher by slug
      description: Public endpoint to retrieve details of a specific publisher using its slug.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The publisher slug (e.g. gramedia-pustaka-utama)
      responses:
        '200':
          description: Publisher retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher retrieved successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '404':
          description: Publisher not found
        '500':
          description: Internal server error

  /api/v1/publishers/{id}:
    put:
      tags:
        - Publisher
      summary: Update a publisher
      description: Admin-only endpoint to update an existing publisher's name and regenerated slug.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The publisher ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublisherRequest'
      responses:
        '200':
          description: Publisher updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher updated successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Publisher not found
        '409':
          description: Publisher slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Publisher
      summary: Delete a publisher
      description: Admin-only endpoint to soft-delete a publisher.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The publisher ID
      responses:
        '200':
          description: Publisher deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Publisher not found
        '500':
          description: Internal server error

  # =========================================================================
  # AUTHORS
  # =========================================================================
  /api/v1/authors:
    get:
      tags:
        - Author
      summary: Get all active authors (paginated)
      description: Public endpoint to retrieve active authors with pagination metadata.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Authors retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "authors retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          description: Internal server error
    post:
      tags:
        - Author
      summary: Create an author
      description: Admin-only endpoint to create a new author. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
      responses:
        '201':
          description: Author created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author created successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Author slug already exists
        '500':
          description: Internal server error

  /api/v1/authors/{slug}:
    get:
      tags:
        - Author
      summary: Get author by slug
      description: Public endpoint to retrieve profile details of a specific author using their slug. To view books by this author, query `/api/v1/books?author={slug}`.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Author slug (e.g. tere-liye)
      responses:
        '200':
          description: Author retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author retrieved successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '404':
          description: Author not found
        '500':
          description: Internal server error

  /api/v1/authors/{id}:
    put:
      tags:
        - Author
      summary: Update an author
      description: Admin-only endpoint to update an existing author's name and biography.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Author ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorRequest'
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author updated successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Author not found
        '409':
          description: Author slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Author
      summary: Delete an author
      description: Admin-only endpoint to soft-delete an author.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Author ID
      responses:
