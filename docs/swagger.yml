        - width
        - height
        - condition
        - stock
        - cover_image
      properties:
        category_id:
          type: integer
          description: "ID of the category"
          example: 1
        author_id:
          type: integer
          description: "ID of the author"
          example: 1
        publisher_id:
          type: integer
          description: "ID of the publisher"
          example: 1
        title:
          type: string
          minLength: 2
          maxLength: 255
          description: "Title of the book"
          example: "The Pragmatic Programmer"
        isbn:
          type: string
          maxLength: 30
          description: "ISBN number (required, max 30 characters)."
          example: "9780135957059"
        synopsis:
          type: string
          minLength: 5
          description: "Synopsis or overview of the book (required, minimum 5 characters)."
          example: "Your journey to mastery in software development."
        price:
          type: integer
          minimum: 0
          description: "Book selling price (or normal price when no discount). If discount_percentage is provided without original_price, system automatically uses this price as original_price and computes discounted selling price."
          example: 135000
        original_price:
          type: integer
          minimum: 0
          nullable: true
          description: "Original strike-through price before discount (optional; if omitted when discount_percentage is provided, system automatically uses price as original_price and computes discounted selling price)."
          example: 150000
        discount_percentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: "Direct discount percentage (optional; when provided without original_price, system automatically treats price as original_price and calculates discounted selling price)."
          example: 10
        weight_grams:
          type: integer
          minimum: 1
          description: "Weight in grams for shipping calculation"
          example: 450
        pages:
          type: integer
          minimum: 1
          description: "Total number of pages (required, minimum 1)."
          example: 352
        publication_year:
          type: integer
          minimum: 1000
          maximum: 2100
          description: "Year of publication between 1000 and 2100 (required)."
          example: 2019
        language:
          type: string
          minLength: 2
          maxLength: 50
          description: "Language of the book edition."
          example: "Indonesia"
        length:
          type: number
          format: double
          minimum: 0.1
          description: "Book length in centimeters for package shipping calculation."
          example: 20.0
        width:
          type: number
          format: double
          minimum: 0.1
          description: "Book width in centimeters for package shipping calculation."
          example: 13.5
        height:
          type: number
          format: double
          minimum: 0.1
          description: "Book height in centimeters for package shipping calculation."
          example: 2.0
        condition:
          type: string
          minLength: 2
          maxLength: 100
          description: "Physical condition of the book (e.g. New, 100% Baru & Segel Penerbit)."
          example: "100% Baru & Segel Penerbit"
        stock:
          type: integer
          minimum: 0
          description: "Stock inventory (required, minimum 0)."
          example: 40
        cover_image:
          type: string
          maxLength: 255
          description: "Relative URL or static path to the cover image (required, max 255 characters)."
          example: "https://example.com/static/covers/pragmatic-programmer.jpg"
        is_active:
          type: boolean
          default: true
          description: "Whether the book is visible to customers (optional, defaults to true)."
