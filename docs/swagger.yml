          minLength: 3
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          description: "Must be at least 8 characters, with uppercase, lowercase, number, and special character."
          example: "StrongP@ssw0rd!"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "StrongP@ssw0rd!"

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: "Refresh token string (optional if refresh_token HTTP-only cookie is set, otherwise required)."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "JWT access token used in Authorization: Bearer <token> header"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: "JWT refresh token used to obtain new token pairs"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    GoogleMobileLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          description: "Google ID Token obtained from native mobile Google Sign-In SDK (recommended)"
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1NiJ9..."
        code:
          type: string
          description: "Google Server Authorization Code (alternative)"
          example: "4/0AeanS0b..."

    ActivateAccountRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: "random_hex_token_from_email"

    ResendActivationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
        - confirm_password
      properties:
        token:
          type: string
          example: "random_hex_token_from_email"
        new_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
        - confirm_password
      properties:
        current_password:
          type: string
          format: password
          example: "OldP@ssw0rd!"
        new_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        refresh_token:
          type: string
          nullable: true
          description: "Current refresh token string (optional if passed via HTTP-only cookie, recommended for mobile apps)."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."


