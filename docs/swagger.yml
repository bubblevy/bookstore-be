openapi: 3.0.3
info:
  title: Bookstore API
  description: The core API for the Bookstore application. This comprehensive API serves as the backend for the entire platform, handling authentication, user management, product catalogs, transactions, and other essential services.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
tags:
  - name: Health
    description: System health and readiness checks
  - name: Auth
    description: User authentication and account management
  - name: Category
    description: Book category catalog management 
  - name: Publisher
    description: Book publisher catalog management 
  - name: Author
    description: Book author catalog management 
  - name: Book
    description: Book catalog management
  - name: Discount
    description: Discount & voucher management
  - name: Address
    description: User shipping address management
  - name: Shipping
    description: RajaOngkir destination lookup and authenticated shipping cost calculation

paths:
  # =========================================================================
  # HEALTH
  # =========================================================================
  /health:
    get:
      tags:
        - Health
      summary: System health check
      description: Returns the basic operational status of the service.
      responses:
        '200':
          description: Service is up and running
          content:
            application/json:
              example:
                status: ok
                service: Bookstore
                timestamp: "2026-10-02T00:00:00Z"

  /health/ready:
    get:
      tags:
        - Health
      summary: Database readiness check
      description: Verifies if the service is successfully connected to the database.
      responses:
        '200':
          description: Database is connected
          content:
            application/json:
              example:
                status: ok
                database: connected
                timestamp: "2026-10-02T00:00:00Z"
        '503':
          description: Database connection unavailable

  # =========================================================================
  # AUTH
  # =========================================================================
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account and sends an activation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload or email already exists

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticates a user and sets HTTP-only cookies for access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=abcde12345; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid credentials or inactive account

  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Generates a new access and refresh token pair. Accepts refresh token via HTTP-only cookie or request body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid, missing, or expired refresh token

  /api/v1/auth/logout:
    delete:
      tags:
        - Auth
      summary: User logout
      description: Revokes the current refresh token and clears authentication cookies.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/activate-account:
    post:
      tags:
        - Auth
      summary: Activate user account
      description: Activates a newly registered account using the token sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Account activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired activation token

  /api/v1/auth/resend-activation:
    post:
      tags:
        - Auth
      summary: Resend activation email
      description: Generates a new activation token and resends the activation email to an unactivated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendActivationRequest'
      responses:
        '200':
          description: Activation email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Sends a password reset link to the user's registered email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset password email sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: Resets the user's password using the token sent via email. Also revokes all existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid token, expired token, or password mismatch

  /api/v1/auth/change-password:
    post:
      tags:
        - Auth
      summary: Change account password
      description: Allows an authenticated user to change their password. Revokes other active sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Incorrect current password or password mismatch
        '401':
          description: Unauthorized request

  /api/v1/auth/google/login:
    get:
      tags:
        - Auth
      summary: Initiate Google OAuth2 Login
      description: Redirects the user to the Google Consent screen.
      responses:
        '303':
          description: Redirects to Google's OAuth2 authorization URL.

  /api/v1/auth/google/callback:
    get:
      tags:
        - Auth
      summary: Google OAuth2 Callback
      description: The callback endpoint for Google OAuth2.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '303':
          description: Login successful, sets auth cookies, and redirects.
        '400':
          description: Missing code or invalid request.
        '401':
          description: Invalid OAuth state (CSRF failure).

  # =========================================================================
  # CATEGORIES
  # =========================================================================
  /api/v1/categories:
    get:
      tags:
        - Category
      summary: Get all active categories
      description: Public endpoint to retrieve all categories available in the store (unpaginated).
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "categories retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryListItem'
        '500':
          description: Internal server error
    post:
      tags:
        - Category
      summary: Create a category
      description: Admin-only endpoint to create a new book category. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category created successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Category slug already exists
        '500':
          description: Internal server error

  /api/v1/categories/{slug}:
    get:
      tags:
        - Category
      summary: Get category by slug
      description: Public endpoint to retrieve details of a specific category using its slug.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The category slug (e.g. fiksi-ilmiah)
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category retrieved successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '404':
          description: Category not found
        '500':
          description: Internal server error

  /api/v1/categories/{id}:
    put:
      tags:
        - Category
      summary: Update a category
      description: Admin-only endpoint to update an existing category's name and regenerated slug.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "category updated successfully"
                  data:
                    $ref: '#/components/schemas/CategoryResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Category not found
        '409':
          description: Category slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Category
      summary: Delete a category
      description: Admin-only endpoint to soft-delete a category.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The category ID
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Category not found
        '500':
          description: Internal server error

  # =========================================================================
  # PUBLISHERS
  # =========================================================================
  /api/v1/publishers:
    get:
      tags:
        - Publisher
      summary: Get all active publishers
      description: Public endpoint to retrieve all publishers available in the store (unpaginated).
      responses:
        '200':
          description: Publishers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publishers retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublisherListItem'
        '500':
          description: Internal server error
    post:
      tags:
        - Publisher
      summary: Create a publisher
      description: Admin-only endpoint to create a new book publisher. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublisherRequest'
      responses:
        '201':
          description: Publisher created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher created successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Publisher slug already exists
        '500':
          description: Internal server error

  /api/v1/publishers/{slug}:
    get:
      tags:
        - Publisher
      summary: Get publisher by slug
      description: Public endpoint to retrieve details of a specific publisher using its slug.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: The publisher slug (e.g. gramedia-pustaka-utama)
      responses:
        '200':
          description: Publisher retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher retrieved successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '404':
          description: Publisher not found
        '500':
          description: Internal server error

  /api/v1/publishers/{id}:
    put:
      tags:
        - Publisher
      summary: Update a publisher
      description: Admin-only endpoint to update an existing publisher's name and regenerated slug.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The publisher ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublisherRequest'
      responses:
        '200':
          description: Publisher updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "publisher updated successfully"
                  data:
                    $ref: '#/components/schemas/PublisherResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Publisher not found
        '409':
          description: Publisher slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Publisher
      summary: Delete a publisher
      description: Admin-only endpoint to soft-delete a publisher.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The publisher ID
      responses:
        '200':
          description: Publisher deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Publisher not found
        '500':
          description: Internal server error

  # =========================================================================
  # AUTHORS
  # =========================================================================
  /api/v1/authors:
    get:
      tags:
        - Author
      summary: Get all active authors (paginated)
      description: Public endpoint to retrieve active authors with pagination metadata.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Authors retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "authors retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          description: Internal server error
    post:
      tags:
        - Author
      summary: Create an author
      description: Admin-only endpoint to create a new author. Slug is automatically generated from name.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
      responses:
        '201':
          description: Author created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author created successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '400':
          description: Validation error
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Author slug already exists
        '500':
          description: Internal server error

  /api/v1/authors/{slug}:
    get:
      tags:
        - Author
      summary: Get author by slug
      description: Public endpoint to retrieve profile details of a specific author using their slug. To view books by this author, query `/api/v1/books?author={slug}`.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Author slug (e.g. tere-liye)
      responses:
        '200':
          description: Author retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author retrieved successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '404':
          description: Author not found
        '500':
          description: Internal server error

  /api/v1/authors/{id}:
    put:
      tags:
        - Author
      summary: Update an author
      description: Admin-only endpoint to update an existing author's name and biography.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Author ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorRequest'
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "author updated successfully"
                  data:
                    $ref: '#/components/schemas/AuthorResult'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Author not found
        '409':
          description: Author slug already exists
        '500':
          description: Internal server error
    delete:
      tags:
        - Author
      summary: Delete an author
      description: Admin-only endpoint to soft-delete an author.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Author ID
      responses:
        '200':
          description: Author deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Author not found
        '500':
          description: Internal server error

  # =========================================================================
  # BOOKS
  # =========================================================================
  /api/v1/books:
    get:
      tags:
        - Book
      summary: Get all books (paginated & filtered)
      description: Public endpoint to retrieve books with search, relational slug filters, price ranges, and sorting. Non-admin users are restricted to active books only.
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search keyword across title and ISBN
        - in: query
          name: category
          required: false
          schema:
            type: string
          description: Filter books by Category slug (e.g., fiksi-sejarah)
        - in: query
          name: author
          required: false
          schema:
            type: string
          description: Filter books by Author slug (e.g., pramoedya-ananta-toer)
        - in: query
          name: publisher
          required: false
          schema:
            type: string
          description: Filter books by Publisher slug (e.g., lentera-dipantara)
        - in: query
          name: min_price
          required: false
          schema:
            type: number
            format: double
            minimum: 0
          description: Minimum book price filter
        - in: query
          name: max_price
          required: false
          schema:
            type: number
            format: double
            minimum: 0
          description: Maximum book price filter
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            enum: [newest, price_asc, price_desc, title_asc]
            default: newest
          description: Sorting criterion
        - in: query
          name: is_active
          required: false
          schema:
            type: string
            enum: ["true", "false", "all"]
          description: Admin-only filter for book status (ignored for non-admin users)
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Books retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "books retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Invalid query parameters (e.g. invalid price format)
        '500':
          description: Internal server error
    post:
      tags:
        - Book
      summary: Create a book
      description: Admin-only endpoint to create a new book. Uses integer foreign keys for relationships and auto-generates unique slug from title.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "book created successfully"
                  data:
                    $ref: '#/components/schemas/BookDetailResult'
        '400':
          description: Validation error or referenced category/author/publisher ID not found
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Book slug or ISBN conflict
        '500':
          description: Internal server error

  /api/v1/books/{slug}:
    get:
      tags:
        - Book
      summary: Get book details by slug
      description: Public endpoint to retrieve full details of an active book. Inactive books return 404 for non-admin visitors.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Book slug (e.g., bumi-manusia)
      responses:
        '200':
          description: Book retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "book retrieved successfully"
                  data:
                    $ref: '#/components/schemas/BookDetailResult'
        '404':
          description: Book not found or inactive
        '500':
          description: Internal server error

  /api/v1/books/{id}:
    put:
      tags:
        - Book
      summary: Update a book
      description: Admin-only endpoint to update an existing book by its numeric ID. Regenerates slug if title changed.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Book ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "book updated successfully"
                  data:
                    $ref: '#/components/schemas/BookDetailResult'
        '400':
          description: Validation error, invalid ID parameter, or foreign key not found
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Book not found
        '409':
          description: Book slug or ISBN conflict
        '500':
          description: Internal server error
    delete:
      tags:
        - Book
      summary: Delete a book
      description: Admin-only endpoint to soft-delete a book.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Book ID
      responses:
        '200':
          description: Book deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Book not found
        '500':
          description: Internal server error

  # =========================================================================
  # DISCOUNTS
  # =========================================================================
  /api/v1/discounts:
    get:
      tags:
        - Discount
      summary: Get all discounts (paginated & lean list)
      description: Admin-only endpoint to retrieve a lean list of discounts without deep relations (books and tiers omitted for speed).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search by discount name or code
        - in: query
          name: is_active
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by active state
        - in: query
          name: only_valid
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter discounts currently within valid date range with available quota
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Discounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "discounts retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscountListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '500':
          description: Internal server error
    post:
      tags:
        - Discount
      summary: Create a discount voucher
      description: Admin-only endpoint to create a voucher. Code is automatically converted to uppercase. Supports PERCENTAGE, FIXED, and TIERED ('Up To') discounts.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiscountRequest'
      responses:
        '201':
          description: Discount created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "discount created successfully"
                  data:
                    $ref: '#/components/schemas/DiscountDetailResult'
        '400':
          description: Validation error, missing required tiers for TIERED type, or invalid book_ids
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '409':
          description: Discount voucher code already exists
        '500':
          description: Internal server error

  /api/v1/discounts/{id}:
    get:
      tags:
        - Discount
      summary: Get discount details by ID
      description: Admin-only endpoint to retrieve comprehensive details of a discount voucher including associated books and tiered rewards.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Discount ID
      responses:
        '200':
          description: Discount retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "discount retrieved successfully"
                  data:
                    $ref: '#/components/schemas/DiscountDetailResult'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Discount not found
        '500':
          description: Internal server error
    put:
      tags:
        - Discount
      summary: Update a discount voucher
      description: Admin-only endpoint to update an existing discount voucher. Code is automatically uppercased.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Discount ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDiscountRequest'
      responses:
        '200':
          description: Discount updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "discount updated successfully"
                  data:
                    $ref: '#/components/schemas/DiscountDetailResult'
        '400':
          description: Validation error, missing tiers, or invalid book_ids
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Discount not found
        '409':
          description: Discount code already exists on another voucher
        '500':
          description: Internal server error
    delete:
      tags:
        - Discount
      summary: Delete a discount voucher
      description: Admin-only endpoint to soft-delete a discount voucher.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Discount ID
      responses:
        '200':
          description: Discount deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Discount not found
        '500':
          description: Internal server error

  /api/v1/discounts/check:
    post:
      tags:
        - Discount
      summary: Validate voucher & calculate cart discount
      description: Authenticated user checkout verification. Fetches book prices and active status directly from the database (no client-side price injection).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckDiscountRequest'
      responses:
        '200':
          description: Voucher applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "voucher applied successfully"
                  data:
                    $ref: '#/components/schemas/CheckDiscountResult'
        '400':
          description: Voucher expired, quota exhausted, minimum purchase not met, or not applicable to cart items
        '401':
          description: Unauthorized request
        '404':
          description: Voucher code not found or cart book not found in database
        '500':
          description: Internal server error

  # =========================================================================
  # ADDRESSES
  # =========================================================================
  /api/v1/addresses:
    get:
      tags:
        - Address
      summary: Get all user addresses
      description: Returns a simplified list of addresses belonging to the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Addresses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "addresses retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressListItem'
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error
    post:
      tags:
        - Address
      summary: Create a new address
      description: Adds a new address for the authenticated user using RajaOngkir destination ID. Maximum 5 addresses per user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address created successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Validation error or maximum address limit reached (5 addresses)
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error

  /api/v1/addresses/{id}:
    get:
      tags:
        - Address
      summary: Get address details by ID
      description: Returns complete details of a specific address owned by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Address retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address retrieved successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error
    put:
      tags:
        - Address
      summary: Update an address
      description: Updates an existing address owned by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address updated successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error
    delete:
      tags:
        - Address
      summary: Delete an address
      description: Performs a soft-delete on an address. Blocked if the address is primary and other addresses exist.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Address deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Cannot delete primary address while other addresses exist, or invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error

  /api/v1/addresses/{id}/primary:
    patch:
      tags:
        - Address
      summary: Set address as primary
      description: Sets the selected address as the primary address and unsets any previous primary address.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Primary address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error

  # =========================================================================
  # SHIPPING
  # =========================================================================
  /api/v1/shipping/destinations:
    get:
      tags:
        - Shipping
      summary: Search domestic destination
      description: Public single-endpoint location lookup using keyword (minimum 3 characters) powered by RajaOngkir/Komerce.
      parameters:
        - in: query
          name: search
          required: true
          schema:
            type: string
            minLength: 3
          description: Keyword to search (e.g., welahan, gayamprit, klaten)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
          description: Limit number of results
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: Destinations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "destinations retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomesticDestination'
        '400':
          description: Search keyword must be at least 3 characters
        '500':
          description: Failed to retrieve destinations from RajaOngkir

  /api/v1/shipping/cost:
    post:
      tags:
        - Shipping
      summary: Calculate domestic shipping cost
      description: Calculates delivery rates from store origin to destination location ID using selected couriers.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckCostRequest'
      responses:
        '200':
          description: Shipping costs calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "shipping costs calculated successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShippingCostResult'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized request
        '500':
          description: Failed to calculate shipping costs from RajaOngkir

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the JWT Access Token (can also be passed automatically via 'access_token' cookie).

  schemas:
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "request successful"
        data:
          type: object
          nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total_items:
          type: integer
          format: int64
          example: 45
        total_pages:
          type: integer
          example: 5

    # =========================================================================
    # CATEGORY SCHEMAS
    # =========================================================================
    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Sains & Teknologi"

    UpdateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Fiksi Ilmiah"

    CategoryListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Fiksi"
        slug:
          type: string
          example: "fiksi"

    CategoryResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Fiksi Ilmiah"
        slug:
          type: string
          example: "fiksi-ilmiah"
        created_at:
          type: string
          format: date-time
          example: "2026-10-14T09:39:55+07:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-14T09:39:55+07:00"

    # =========================================================================
    # PUBLISHER SCHEMAS
    # =========================================================================
    CreatePublisherRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: "Gramedia Pustaka Utama"

    UpdatePublisherRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: "Mizan Publishing"

    PublisherListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Gramedia Pustaka Utama"
        slug:
          type: string
          example: "gramedia-pustaka-utama"

    PublisherResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Gramedia Pustaka Utama"
        slug:
          type: string
          example: "gramedia-pustaka-utama"
        created_at:
          type: string
          format: date-time
          example: "2026-10-14T10:15:30+07:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-14T10:15:30+07:00"

    # =========================================================================
    # AUTHOR SCHEMAS
    # =========================================================================
    CreateAuthorRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: "Tere Liye"
        bio:
          type: string
          maxLength: 2000
          nullable: true
          example: "Penulis novel ternama Indonesia"

    UpdateAuthorRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: "Tere Liye"
        bio:
          type: string
          maxLength: 2000
          nullable: true
          example: "Penulis novel fiksi Indonesia"

    AuthorListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Tere Liye"
        slug:
          type: string
          example: "tere-liye"

    AuthorResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Tere Liye"
        slug:
          type: string
          example: "tere-liye"
        bio:
          type: string
          nullable: true
          example: "Penulis novel ternama Indonesia"
        created_at:
          type: string
          format: date-time
          example: "2026-10-14T10:15:30+07:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-14T10:15:30+07:00"

    # =========================================================================
    # BOOK SCHEMAS
    # =========================================================================
    CreateBookRequest:
      type: object
      required:
        - category_id
        - author_id
        - publisher_id
        - title
        - price
        - weight_grams
      properties:
        category_id:
          type: integer
          example: 1
        author_id:
          type: integer
          example: 1
        publisher_id:
          type: integer
          example: 1
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Bumi Manusia"
        isbn:
          type: string
          maxLength: 30
          nullable: true
          example: "9789799731234"
        synopsis:
          type: string
          nullable: true
          example: "Roman berlatar Hindia Belanda menceritakan Minke dan Annelies."
        price:
          type: number
          format: double
          minimum: 0
          example: 135000.00
        weight_grams:
          type: integer
          minimum: 1
          example: 450
        pages:
          type: integer
          minimum: 1
          nullable: true
          example: 535
        publication_year:
          type: integer
          minimum: 1000
          maximum: 2100
          nullable: true
          example: 2011
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 40
        cover_image:
          type: string
          maxLength: 255
          nullable: true
          example: "https://example.com/covers/bumi-manusia.jpg"
        is_active:
          type: boolean
          default: true
          example: true

    UpdateBookRequest:
      type: object
      required:
        - category_id
        - author_id
        - publisher_id
        - title
        - price
        - weight_grams
      properties:
        category_id:
          type: integer
          example: 1
        author_id:
          type: integer
          example: 1
        publisher_id:
          type: integer
          example: 1
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: "Bumi Manusia (Edisi Khusus)"
        isbn:
          type: string
          maxLength: 30
          nullable: true
          example: "9789799731234"
        synopsis:
          type: string
          nullable: true
          example: "Edisi hardcover terbaru dari Tetralogi Buru."
        price:
          type: number
          format: double
          minimum: 0
          example: 160000.00
        weight_grams:
          type: integer
          minimum: 1
          example: 550
        pages:
          type: integer
          minimum: 1
          nullable: true
          example: 550
        publication_year:
          type: integer
          minimum: 1000
          maximum: 2100
          nullable: true
          example: 2024
        stock:
          type: integer
          minimum: 0
          example: 50
        cover_image:
          type: string
          maxLength: 255
          nullable: true
          example: "https://example.com/covers/bumi-manusia-special.jpg"
        is_active:
          type: boolean
          example: true

    BookRelationItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Fiksi Sejarah"
        slug:
          type: string
          example: "fiksi-sejarah"

    BookListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Bumi Manusia"
        slug:
          type: string
          example: "bumi-manusia"
        price:
          type: number
          format: double
          example: 135000.00
        stock:
          type: integer
          example: 40
        weight_grams:
          type: integer
          example: 450
        cover_image:
          type: string
          nullable: true
          example: "https://example.com/covers/bumi-manusia.jpg"
        is_active:
          type: boolean
          example: true
        category:
          $ref: '#/components/schemas/BookRelationItem'
        author:
          $ref: '#/components/schemas/BookRelationItem'
        publisher:
          $ref: '#/components/schemas/BookRelationItem'

    BookDetailResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Bumi Manusia"
        slug:
          type: string
          example: "bumi-manusia"
        isbn:
          type: string
          nullable: true
          example: "9789799731234"
        synopsis:
          type: string
          nullable: true
