openapi: 3.0.3
info:
  title: Bookstore API
  description: The core API for the Bookstore application. This comprehensive API serves as the backend for the entire platform, handling authentication, user management, product catalogs, transactions, and other essential services.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
tags:
  - name: Health
    description: System health and readiness checks
  - name: Auth
    description: User authentication and account management
  - name: Address
    description: User shipping address management (CRUD, primary address, max 5 addresses)
paths:
  /health:
    get:
      tags:
        - Health
      summary: System health check
      description: Returns the basic operational status of the service.
      responses:
        '200':
          description: Service is up and running
          content:
            application/json:
              example:
                status: ok
                service: Bookstore
                timestamp: "2026-10-02T00:00:00Z"

  /health/ready:
    get:
      tags:
        - Health
      summary: Database readiness check
      description: Verifies if the service is successfully connected to the database.
      responses:
        '200':
          description: Database is connected
          content:
            application/json:
              example:
                status: ok
                database: connected
                timestamp: "2026-10-02T00:00:00Z"
        '503':
          description: Database connection unavailable

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account and sends an activation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request payload or email already exists

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticates a user and sets HTTP-only cookies for access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=abcde12345; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid credentials or inactive account

  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Generates a new access and refresh token pair. Accepts refresh token via HTTP-only cookie or request body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid, missing, or expired refresh token

  /api/v1/auth/logout:
    delete:
      tags:
        - Auth
      summary: User logout
      description: Revokes the current refresh token and clears authentication cookies.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/activate-account:
    post:
      tags:
        - Auth
      summary: Activate user account
      description: Activates a newly registered account using the token sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Account activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired activation token

  /api/v1/auth/resend-activation:
    post:
      tags:
        - Auth
      summary: Resend activation email
      description: Generates a new activation token and resends the activation email to an unactivated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendActivationRequest'
      responses:
        '200':
          description: Activation email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Sends a password reset link to the user's registered email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset password email sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: Resets the user's password using the token sent via email. Also revokes all existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid token, expired token, or password mismatch

  /api/v1/auth/change-password:
    post:
      tags:
        - Auth
      summary: Change account password
      description: Allows an authenticated user to change their password. Revokes other active sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Incorrect current password or password mismatch
        '401':
          description: Unauthorized request

  /api/v1/auth/google/login:
    get:
      tags:
        - Auth
      summary: Initiate Google OAuth2 Login
      description: Redirects the user to the Google Consent screen.
      responses:
        '302':
          description: Redirects to Google's OAuth2 authorization URL.

  /api/v1/auth/google/callback:
    get:
      tags:
        - Auth
      summary: Google OAuth2 Callback
      description: The callback endpoint for Google OAuth2. Google redirects here with an authorization code. The server exchanges it for a token, creates/updates the user, sets HTTP-only cookies, and redirects to the frontend dashboard.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: The authorization code returned by Google.
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: The CSRF state token to validate against the cookie.
      responses:
        '302':
          description: Login successful, sets `access_token` and `refresh_token` cookies, and redirects to the frontend.
        '400':
          description: Missing code or invalid request.
        '401':
          description: Invalid OAuth state (CSRF failure).

  /api/v1/addresses:
    get:
      tags:
        - Address
      summary: Get all user addresses
      description: Returns a simplified list of addresses belonging to the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Addresses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "addresses retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressListItem'
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error
    post:
      tags:
        - Address
      summary: Create a new address
      description: Adds a new address for the authenticated user. Maximum 5 addresses per user. First address becomes primary automatically.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address created successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Validation error or maximum address limit reached (5 addresses)
        '401':
          description: Unauthorized request
        '500':
          description: Internal server error

  /api/v1/addresses/{id}:
    get:
      tags:
        - Address
      summary: Get address details by ID
      description: Returns complete details of a specific address owned by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Address retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address retrieved successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error
    put:
      tags:
        - Address
      summary: Update an address
      description: Updates an existing address owned by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "address updated successfully"
                  data:
                    $ref: '#/components/schemas/AddressDetail'
        '400':
          description: Validation error or invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error
    delete:
      tags:
        - Address
      summary: Delete an address
      description: Performs a soft-delete on an address. Blocked if the address is primary and other addresses exist.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Address deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Cannot delete primary address while other addresses exist, or invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error

  /api/v1/addresses/{id}/primary:
    patch:
      tags:
        - Address
      summary: Set address as primary
      description: Sets the selected address as the primary address and unsets any previous primary address.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The address ID
      responses:
        '200':
          description: Primary address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid ID parameter
        '401':
          description: Unauthorized request
        '404':
          description: Address not found
        '500':
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the JWT Access Token (can also be passed automatically via 'access_token' cookie).

  schemas:
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "request successful"
        data:
          type: object
          nullable: true

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 3
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          description: "Must be at least 8 characters, with uppercase, lowercase, number, and special character."
          example: "StrongP@ssw0rd!"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "StrongP@ssw0rd!"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: "Required only if not provided via HTTP-only cookie"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ActivateAccountRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: "random_hex_token_from_email"

    ResendActivationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
        - confirm_password
      properties:
        token:
          type: string
          example: "random_hex_token_from_email"
        new_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
        - confirm_password
      properties:
        current_password:
          type: string
          format: password
          example: "OldP@ssw0rd!"
        new_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"
        confirm_password:
          type: string
          format: password
          example: "NewStr0ngP@ss!"

    CreateAddressRequest:
      type: object
      required:
        - receiver_name
        - phone
        - address_line
        - province_id
        - province_name
        - city_id
        - city_name
        - postal_code
      properties:
        receiver_name:
          type: string
          minLength: 3
          maxLength: 150
          example: "Budi Santoso"
        phone:
          type: string
          minLength: 9
          maxLength: 20
          example: "081234567890"
        address_line:
          type: string
          minLength: 10
          example: "Jl. Merbabu No. 12, RT 03 / RW 02, Kel. Gayamprit"
        province_id:
          type: integer
          example: 10
        province_name:
          type: string
          example: "Jawa Tengah"
        city_id:
          type: integer
          example: 196
        city_name:
          type: string
          example: "Klaten"
        subdistrict_id:
          type: integer
          nullable: true
          example: null
        subdistrict_name:
          type: string
          nullable: true
          example: null
        postal_code:
          type: string
          pattern: '^[0-9]{5}$'
          example: "57411"
        is_primary:
          type: boolean
          example: true

    UpdateAddressRequest:
      type: object
      required:
        - receiver_name
        - phone
        - address_line
        - province_id
        - province_name
        - city_id
        - city_name
        - postal_code
      properties:
        receiver_name:
          type: string
          minLength: 3
          maxLength: 150
          example: "Budi Santoso"
        phone:
          type: string
          minLength: 9
          maxLength: 20
          example: "081234567890"
        address_line:
          type: string
          minLength: 10
          example: "Jl. Merbabu No. 12, RT 03 / RW 02, Kel. Gayamprit"
        province_id:
          type: integer
          example: 10
        province_name:
          type: string
          example: "Jawa Tengah"
        city_id:
          type: integer
          example: 196
        city_name:
          type: string
          example: "Klaten"
        subdistrict_id:
          type: integer
          nullable: true
          example: null
        subdistrict_name:
          type: string
          nullable: true
          example: null
        postal_code:
          type: string
          pattern: '^[0-9]{5}$'
          example: "57411"
        is_primary:
          type: boolean
          example: true

    AddressListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        receiver_name:
          type: string
          example: "Budi Santoso"
        phone:
          type: string
          example: "081234567890"
        address_line:
          type: string
          example: "Jl. Merbabu No. 12, RT 03 / RW 02, Kel. Gayamprit"
        city_name:
          type: string
          example: "Klaten"
        province_name:
          type: string
          example: "Jawa Tengah"
        postal_code:
          type: string
          example: "57411"
        is_primary:
          type: boolean
          example: true

    AddressDetail:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 5
        receiver_name:
          type: string
          example: "Budi Santoso"
        phone:
          type: string
          example: "081234567890"
        address_line:
          type: string
          example: "Jl. Merbabu No. 12, RT 03 / RW 02, Kel. Gayamprit"
        province_id:
          type: integer
          example: 10
        province_name:
          type: string
          example: "Jawa Tengah"
        city_id:
          type: integer
          example: 196
        city_name:
          type: string
          example: "Klaten"
        subdistrict_id:
          type: integer
          nullable: true
          example: null
        subdistrict_name:
          type: string
          nullable: true
          example: null
        postal_code:
          type: string
          example: "57411"
        is_primary:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-10-14T09:39:55+07:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-14T09:39:55+07:00"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null