name: Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Production .env File
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod
          python3 - << 'EOF'
          import json

          settings = [
              {"name": "WEBSITES_PORT", "value": "8000", "slotSetting": False},
              {"name": "WEBSITES_CONTAINER_START_TIME_LIMIT", "value": "1800", "slotSetting": False}
          ]

          target_keys = {
              "DATABASE_USER", "DATABASE_PASSWORD", "DATABASE_NAME",
              "REDIS_PASSWORD", "RABBITMQ_USER", "RABBITMQ_PASSWORD"
          }

          with open('.env.prod') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if '=' in line:
                      k, v = line.split('=', 1)
                      k = k.strip()
                      v = v.strip("\"'")
                      if k in target_keys:
                          settings.append({"name": k, "value": v, "slotSetting": False})

          with open('core_settings.json', 'w') as out:
              json.dump(settings, out, indent=2)
          EOF

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload .env and Deploy to Azure App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "1. Mendapatkan Access Key dari Storage Account..."
            STORAGE_KEY=$(az storage account keys list \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query "[0].value" -o tsv)

            echo "2. Mengunggah .env ke Azure File Share..."
            az storage file upload \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key "$STORAGE_KEY" \
              --share-name ${{ secrets.AZURE_STORAGE_SHARE }} \
              --source .env.prod \
              --path .env

            echo "3. Menerapkan docker-compose.prod.yml..."
            az webapp config container set \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --multicontainer-config-type COMPOSE \
              --multicontainer-config-file docker-compose.prod.yml

            echo "4. Menyinkronkan setting dasar container..."
            az webapp config appsettings set \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --settings @core_settings.json

            echo "5. Merestart App Service..."
            az webapp restart \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}