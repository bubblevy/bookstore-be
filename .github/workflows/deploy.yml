name: Deploy to Instabox & Azure VM

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy-instabox-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Install Instabox CLI & Deploy
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          curl -fsSL https://instabox.sh/install.sh | sh
          export PATH="$HOME/.instabox/bin:$PATH"
          
          instabox exec "$MACHINE_ID" -- bash -c '
            set -e
            cd /data/workspace/bookstore
            sudo chown -R $(id -u):$(id -g) .
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public logs
            sudo chown -R 1001:1001 logs
            sudo chmod -R 775 logs
            sudo chmod -R 777 public
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
          '
  deploy-azure-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare VM Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.AZURE_VM_USER }}/bookstore/public /home/${{ secrets.AZURE_VM_USER }}/bookstore/logs
            sudo chown -R ${{ secrets.AZURE_VM_USER }}:${{ secrets.AZURE_VM_USER }} /home/${{ secrets.AZURE_VM_USER }}/bookstore
            sudo chmod -R 775 /home/${{ secrets.AZURE_VM_USER }}/bookstore

      - name: Copy Files to VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: ".,!vendor,!bin,!tmp"
          target: "/home/${{ secrets.AZURE_VM_USER }}/bookstore"

      - name: Build & Run Services on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            cd /home/${{ secrets.AZURE_VM_USER }}/bookstore
            mkdir -p public logs

            sudo chown -R 1001:1001 logs
            sudo chmod -R 775 logs
            sudo chmod -R 777 public

            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps