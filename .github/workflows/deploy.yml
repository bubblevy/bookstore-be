name: Deploy to Instabox

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Instabox CLI & Deploy
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          curl -fsSL https://instabox.sh/install.sh | sh
          export PATH="$HOME/.instabox/bin:$PATH"

          instabox exec "$MACHINE_ID" -- bash -c '
            set -e
            cd /data/workspace/bookstore
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public logs
            sudo chown -R 1001:1001 public logs
            sudo chmod -R 775 public logs
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
          '