name: Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Production .env File
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Docker Compose and Sync App Settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "1. Applying docker-compose.prod.yml to ${{ secrets.AZURE_WEBAPP_NAME }} in ${{ secrets.AZURE_RESOURCE_GROUP }}..."
            az webapp config container set \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --multicontainer-config-type COMPOSE \
              --multicontainer-config-file docker-compose.prod.yml

            echo "2. Injecting environment variables from secret into Azure App Service settings..."
            SETTINGS=$(grep -v '^#' .env.prod | grep '=' | tr '\n' ' ')
            if [ -n "$SETTINGS" ]; then
              az webapp config appsettings set \
                --name ${{ secrets.AZURE_WEBAPP_NAME }} \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --settings $SETTINGS
            fi

            echo "3. Restarting App Service to apply configurations and load containers..."
            az webapp restart \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}